{% extends 'base.html' %}

{% block content %}
<div class="meta-card">
    <div class="brand-header">Settings</div>
    <div class="subtitle">Select your exported instagram-cookies.txt file to authenticate downloads.</div>

    <form id="uploadForm">
        <div class="form-group">
            <input type="file" id="cookiesFile" name="cookies_file" accept=".txt" style="display: none;">
            <button type="button" id="fileLabelBtn">
                {% if cookies_exist %}
                    Replace Cookies File
                {% else %}
                    Choose Cookies File
                {% endif %}
            </button>
        </div>
    </form>

    <div id="status"></div>
</div>

<!-- Link your external JS file here -->
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
