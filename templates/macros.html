{% macro media_card(url, is_video, username, card_id) %}
<div id="{{ card_id }}" class="media-card-wrapper">
    <div class="media-card">
        <a href="{{ url }}" target="_blank" class="media-link">
            {% if is_video %}
                <!-- Swapped src for data-src, added lazy-media class, added preload="none" -->
                <video data-src="{{ url }}" class="media-element lazy-media" preload="none"></video>
                <div class="video-icon-overlay">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4v16l15-8z"/></svg>
                </div>
            {% else %}
                <!-- Swapped src for data-src, added lazy-media class -->
                <img data-src="{{ url }}" class="media-element lazy-media">
            {% endif %}
        </a>
    </div>

    <div class="media-action-row">
        <!-- Direct iOS-Friendly Download Button -->
        <a href="{{ url }}?download=1" class="action-btn download-btn" title="Download File">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        </a>

        <button type="button" class="action-btn delete-btn" onclick="deleteMedia('{{ url }}', '{{ username }}', '{{ card_id }}')" title="Delete Media">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
    </div>
</div>
{% endmacro %}
